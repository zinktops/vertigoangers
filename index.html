<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vertigo — le guide des oasis vertes d'Angers : parcs, jardins, épiceries bio, restaurants végétariens et entreprises engagées." />
    <title>Vertigo — Vert, t'y go · Angers</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <style>
      :root {
        --green-900: #14532d;
        --green-700: #15803d;
        --green-500: #22c55e;
        --green-100: #dcfce7;
        --green-50: #f0fdf4;
        --bg: #f3faf4;
        --stone: #44403c;
        --stone-light: #78716c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--stone);
        display: flex;
        flex-direction: column;
      }

      /* ---------- Header ---------- */
      header {
        position: sticky; top: 0; z-index: 1100;
        background: rgba(255,255,255,.85);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--green-100);
      }
      .header-inner {
        max-width: 1280px; margin: 0 auto; padding: 10px 20px;
        display: flex; align-items: center; gap: 16px;
      }
      .logo {
        width: 38px; height: 38px; border-radius: 12px;
        background: #e2f6e9; display: grid; place-items: center;
        font-size: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
      }
      .brand h1 { font-size: 20px; font-weight: 800; color: var(--green-900); letter-spacing: -0.02em; }
      .brand p { font-size: 11px; color: var(--green-700); opacity: .8; }
      .search-wrap { position: relative; margin-left: auto; max-width: 420px; flex: 1; }
      .search-wrap input {
        width: 100%; padding: 9px 16px 9px 38px;
        font-size: 14px; font-family: inherit;
        border-radius: 999px; border: 1px solid var(--green-100);
        background: #f0f9f2; outline: none; transition: .2s;
      }
      .search-wrap input:focus { background: #fff; border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100); }
      .search-wrap .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .4; }

      /* ---------- Filtres ---------- */
      .filters {
        max-width: 1280px; margin: 0 auto; padding: 14px 20px 4px;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      }
      .filters .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--green-700); opacity: .7; margin-right: 4px; }
      .chip {
        font-family: inherit; font-size: 12px; font-weight: 500;
        padding: 6px 14px; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--green-100); background: #fff; color: var(--green-700);
        transition: .15s;
      }
      .chip:hover { border-color: var(--green-500); }
      .chip.active { background: var(--green-500); border-color: var(--green-500); color: #fff; box-shadow: 0 1px 4px rgba(34,194,94,.35); }
      .count { margin-left: auto; font-size: 12px; color: var(--green-700); opacity: .7; }

      /* ---------- Layout ---------- */
      .layout {
        max-width: 1280px; width: 100%; margin: 0 auto;
        padding: 14px 20px; flex: 1;
        display: grid; grid-template-columns: 340px 1fr; gap: 16px;
        align-items: stretch;
      }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
        .list-panel { max-height: 300px; }
        .map-panel { height: 60vh; }
      }

      /* ---------- Liste ---------- */
      .list-panel { overflow-y: auto; max-height: calc(100vh - 210px); display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
      .card {
        display: flex; gap: 12px; text-align: left; width: 100%;
        background: #fff; border: 1px solid var(--green-100); border-radius: 16px;
        padding: 14px; cursor: pointer; font-family: inherit;
        box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: .15s;
      }
      .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
      .card.selected { border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100); }
      .thumb {
        width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0;
        display: grid; place-items: center; font-size: 24px; overflow: hidden;
        background: var(--ring, #d9f4e0);
      }
      .thumb img { width: 100%; height: 100%; object-fit: cover; }
      .card h3 { font-size: 14px; font-weight: 600; color: #1c1917; }
      .card .addr { font-size: 11px; color: var(--green-700); opacity: .6; margin-top: 2px; }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
      .tag { font-size: 10px; padding: 2px 9px; border-radius: 999px; background: #eef7f0; color: #14532d; }
      .tag.cat { color: #fff; background: var(--cat-color, #34a853); font-weight: 500; }

      /* ---------- Carte ---------- */
      .map-panel {
        position: relative; border-radius: 24px; overflow: hidden;
        border: 1px solid var(--green-100); box-shadow: 0 1px 3px rgba(0,0,0,.05);
        min-height: 480px; height: calc(100vh - 210px);
      }
      #map { width: 100%; height: 100%; background: #e6f5e9; }
      .leaflet-container { font-family: inherit; }

      /* popups Leaflet */
      .leaflet-popup-content-wrapper { border-radius: 16px; padding: 3px; }
      .leaflet-popup-content { font-family: inherit; margin: 10px 14px; line-height: 1.45; }
      .popup-title { font-weight: 700; font-size: 14px; color: #1c1917; margin-bottom: 2px; }
      .popup-cat { font-size: 10px; color: #fff; border-radius: 999px; padding: 2px 8px; font-weight: 500; }
      .popup-desc { font-size: 12px; color: var(--stone-light); margin-top: 6px; }

      /* fiche détail */
      .detail {
        position: absolute; bottom: 18px; left: 18px; z-index: 1000;
        width: min(380px, calc(100% - 36px));
        background: #fff; border-radius: 24px; border: 1px solid var(--green-100);
        box-shadow: 0 12px 40px rgba(0,0,0,.14); padding: 20px;
        max-height: calc(100% - 36px); overflow-y: auto;
      }
      .detail-top { display: flex; gap: 12px; align-items: flex-start; }
      .detail-top .thumb { width: 60px; height: 60px; border-radius: 16px; font-size: 26px; }
      .detail h2 { font-size: 17px; font-weight: 700; color: #1c1917; line-height: 1.2; }
      .detail .close {
        margin-left: auto; border: none; background: none; font-size: 18px;
        color: #a8a29e; cursor: pointer; line-height: 1; padding: 2px;
      }
      .detail .close:hover { color: #44403c; }
      .detail .desc { font-size: 13px; color: var(--stone-light); margin-top: 12px; line-height: 1.6; }
      .detail .photo { width: 100%; height: 150px; object-fit: cover; border-radius: 16px; margin-top: 12px; border: 1px solid var(--green-50); }
      .detail .tags { margin-top: 12px; }
      .detail .tag { font-size: 11px; padding: 4px 11px; background: var(--green-50); border: 1px solid var(--green-100); color: var(--green-700); font-weight: 500; }
      .detail .actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
      .btn-itinerary {
        flex: 1; display: block; text-align: center; text-decoration: none;
        font-size: 14px; font-weight: 600; padding: 11px; border-radius: 12px;
        background: var(--green-500); color: #fff; transition: .15s;
      }
      .btn-itinerary:hover { background: #16a34a; }
      .detail .access { font-size: 11px; color: var(--green-700); opacity: .6; }

      .hint {
        position: absolute; top: 14px; left: 14px; z-index: 1000;
        background: rgba(255,255,255,.92); border: 1px solid var(--green-100);
        border-radius: 999px; padding: 6px 12px; font-size: 11px; color: var(--green-900);
        opacity: .75; pointer-events: none;
      }

      /* ---------- Footer ---------- */
      footer {
        text-align: center; font-size: 12px; color: var(--green-900);
        opacity: .5; padding: 10px 20px 16px;
      }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="logo">🍃</div>
          <div class="brand">
            <h1>Vertigo</h1>
            <p>Vert, t'y go · Angers</p>
          </div>
        </div>
        <div class="search-wrap">
          <span class="icon">🔍</span>
          <input id="search" type="search" placeholder="Rechercher un lieu, une ambiance…" />
        </div>
      </div>
    </header>

    <div class="filters">
      <span class="label">Filtrer</span>
      <div id="chips" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
      <span class="count" id="count"></span>
    </div>

    <div class="layout">
      <aside class="list-panel" id="list"></aside>
      <div class="map-panel">
        <div id="map"></div>
        <div class="hint">🖱️ Glisser pour déplacer · molette pour zoomer</div>
        <div id="detail" style="display:none;"></div>
      </div>
    </div>

    <footer>
      Vertigo — le guide des oasis vertes d'Angers · fond de carte ©
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // =====================================================================
      // Données — à modifier / enrichir ici
      // =====================================================================
      const CAT_STYLE = {
        "Parc & Jardin":          { color: "#34a853", ring: "#d9f4e0", emoji: "🌳" },
        "Espace naturel":         { color: "#8bc34a", ring: "#e8f5d8", emoji: "🌾" },
        "Loisir végétal":         { color: "#7cb0e8", ring: "#dceefc", emoji: "🦋" },
        "Épicerie bio & locale":  { color: "#f4a142", ring: "#fce8d0", emoji: "🥕" },
        "Entreprise engagée":     { color: "#6a8fd8", ring: "#dfe9fb", emoji: "🤝" },
        "Restaurant végétarien":  { color: "#e86a8a", ring: "#fadde5", emoji: "🥗" },
      };
      const photoUrl = (f) =>
        "https://commons.wikimedia.org/wiki/Special:FilePath/" +
        encodeURIComponent(f) + "?width=420";

      const LIEUX = [
        { id:"jardin-plantes", nom:"Jardin des Plantes", cat:"Parc & Jardin", lat:47.4748, lon:-0.5445,
          desc:"Le jardin botanique historique d'Angers : arboretum, serres tropicales, grandes plates-bandes et coin pique-nique ombragé au cœur du centre-ville.",
          ambiances:["Botanique","Ombragé","Pique-nique"], taille:"4 ha", access:"Place Pierre Mendès France",
          photo:"LV 286 - Angers - Panorama sur le Jardin des plantes.jpg", emoji:"🌿" },
        { id:"garenne", nom:"Parc de la Garenne", cat:"Parc & Jardin", lat:47.4768, lon:-0.5788,
          desc:"Poumon vert emblématique au bord de la Maine : 50 ha de prairies, sous-bois, manège, buvette et points de vue sur le fleuve. Site classé.",
          ambiances:["Rivière","Famille","Grande balade"], taille:"50 ha", access:"Bd Arago / rive gauche de la Maine",
          photo:"Parc de la Garenne 3.JPG", emoji:"🌳" },
        { id:"mail", nom:"Jardin du Mail", cat:"Parc & Jardin", lat:47.4710, lon:-0.5465,
          desc:"Jardin à la française dans le prolongement du cours de la cathédrale : broderies végétales, kiosque à musique et ambiance très paisible.",
          ambiances:["Centre-ville","Calme","Patrimoine"], taille:"1,5 ha", access:"Bd du Mail",
          photo:"Kiosque à musique du Mail, Angers.jpg", emoji:"🌷" },
        { id:"terra", nom:"Terra Botanica", cat:"Loisir végétal", lat:47.4930, lon:-0.5660,
          desc:"Premier parc à thème européen dédié au végétal : 500 000 plantes, serres, galerie des papillons et attractions au nord de la ville (payant).",
          ambiances:["Famille","Découverte","Payant"], taille:"17 ha", access:"Route de Cantenay Épinard",
          photo:"Terra Botanica Angers.JPG", emoji:"🦋" },
        { id:"st-nicolas", nom:"Étang Saint-Nicolas", cat:"Espace naturel", lat:47.4840, lon:-0.5750,
          desc:"Étang et bois romantiques aménagés au XIXe siècle : sentiers sous les arbres, petites cascades et aires de jeu. Idéal pause nature.",
          ambiances:["Bois","Étang","Promenade"], taille:"10 ha", access:"Rue Saint-Jacques",
          photo:"Angers - Étang Saint-Nicolas.jpg", emoji:"🦆" },
        { id:"chalouere", nom:"Parc de la Chalouère", cat:"Parc & Jardin", lat:47.4860, lon:-0.5900,
          desc:"Vaste parc ouvert à l'ouest de la Garenne, relié aux parcs des Carrières et de la Haye : plus de 100 ha de nature variée à explorer.",
          ambiances:["Sport","Nature","Grande balade"], taille:"30 ha", access:"Av. de la Chalouère", emoji:"🚴" },
        { id:"carrieres", nom:"Parc des Carrières", cat:"Espace naturel", lat:47.4785, lon:-0.5840,
          desc:"Anciennes ardoisières reconverties en espace naturel : falaises d'ardoise, rochers et végétation singulière, prolongement de la Garenne.",
          ambiances:["Insolite","Ardoise","Sauvage"], taille:"15 ha", access:"Chemin des Carrières", emoji:"⛏️" },
        { id:"hutreau", nom:"Parc du Hutreau", cat:"Parc & Jardin", lat:47.4410, lon:-0.5970,
          desc:"Grand parc de loisirs au sud de la ville : ludiparc pour enfants, prairies, jeux et grandes tables de pique-nique à l'entrée sud.",
          ambiances:["Famille","Jeux","Pique-nique"], taille:"12 ha", access:"Chemin du Hutreau", emoji:"🛝" },
        { id:"lac-maine", nom:"Lac de Maine & Parc Jean Turc", cat:"Espace naturel", lat:47.4470, lon:-0.5620,
          desc:"Plan d'eau sportif bordé d'un parc arboré : plages de détente, base nautique, sentiers de course à pied et coucher de soleil garanti.",
          ambiances:["Lac","Sport","Coucher de soleil"], taille:"60 ha", access:"Av. du Lac de Maine",
          photo:"Angers - Panorama lac de Maine.jpg", emoji:"🌅" },
        { id:"bout-monde", nom:"Promenade du Bout du Monde", cat:"Parc & Jardin", lat:47.4720, lon:-0.5630,
          desc:"Sous les remparts du château, entre ville et Maine : jardins suspendus au pied des tours de la forteresse, spot le plus photogénique d'Angers.",
          ambiances:["Rivière","Patrimoine","Romantique"], taille:"3 ha", access:"Promenade du Bout du Monde",
          photo:"Angers promenade du Bout du Monde-2015d.JPG", emoji:"🏯" },
        { id:"arboretum", nom:"Arboretum Gaston Allard", cat:"Parc & Jardin", lat:47.4507, lon:-0.5443,
          desc:"Écrin vert de 7 ha planté par Gaston Allard entre 1863 et 1915 : arbres remarquables de tous continents, serres et allées apaisées.",
          ambiances:["Arbres","Calme","Découverte"], taille:"7 ha", access:"Rue du Château d'Orgemont",
          photo:"P1320123 Angers arboretum GA arbre z rwk.jpg", emoji:"🍂" },
        { id:"bellebeille", nom:"Parc de Belle-Beille", cat:"Parc & Jardin", lat:47.4590, lon:-0.5810,
          desc:"Parc de quartier convivial à l'ouest : pelouses, aires de jeux et cheminements ombragés, très apprécié des familles du secteur.",
          ambiances:["Quartier","Famille","Ombragé"], taille:"8 ha", access:"Rue du Grand Launay", emoji:"🧺" },
        { id:"racynes", nom:"Racynes", cat:"Épicerie bio & locale", lat:47.4690, lon:-0.5530,
          desc:"Épicerie-pause-déjeuner bio et locale : produits frais et gourmands, menus faits maison de saison à emporter et paniers anti-gaspillage.",
          ambiances:["Vrac","Fait maison","Anti-gaspi"], taille:"Boutique", access:"Centre-ville d'Angers", emoji:"🧺" },
        { id:"biocoop-pyramide", nom:"Biocoop La Pyramide", cat:"Épicerie bio & locale", lat:47.4480, lon:-0.5690,
          desc:"Magasin coopératif bio près du Lac de Maine : large gamme d'épicerie, vrac, produits locaux et fruits & légumes bio.",
          ambiances:["Coopérative","Vrac","Local"], taille:"Supermarché", access:"Quartier de la Pyramide", emoji:"🥬" },
        { id:"quai-oliviers", nom:"Quai des Oliviers", cat:"Épicerie bio & locale", lat:47.4660, lon:-0.5480,
          desc:"Épicerie fine bio aux saveurs méditerranéennes : plus de 800 produits rares et gourmands, huiles d'olive, épices, charcuteries et vins.",
          ambiances:["Méditerranéen","Épicerie fine","Bio"], taille:"Boutique", access:"Centre-ville d'Angers", emoji:"🫒" },
        { id:"sicle", nom:"SICLE — Jardins & paysages", cat:"Entreprise engagée", lat:47.4640, lon:-0.5560,
          desc:"SCOP de paysagistes-jardiniers à vélo, labellisée Zéro Phyto : conception et entretien écologiques de jardins, ateliers participatifs et ferme urbaine de Climax dès 2026.",
          ambiances:["SCOP","Zéro Phyto","À vélo"], taille:"Coopérative", access:"25 avenue Montaigne", emoji:"🚲" },
        { id:"potiron", nom:"Potiron & Ciboulette", cat:"Restaurant végétarien", lat:47.4700, lon:-0.5510,
          desc:"Restaurant-salon de thé : plats faits maison, biologiques, sans gluten ni lactose, adaptés à tous les régimes — omnivore, végétarien ou vegan.",
          ambiances:["Vegan friendly","Sans gluten","Fait maison"], taille:"Restaurant", access:"Centre-ville d'Angers", emoji:"🎃" },
        { id:"resto-jardin", nom:"Le Resto du Jardin", cat:"Restaurant végétarien", lat:47.4560, lon:-0.5430,
          desc:"Cuisine créative 100 % bio à base de produits locaux et de saison, dans une maison pleine de charme entourée de verdure.",
          ambiances:["100% bio","Local","Créatif"], taille:"Restaurant", access:"61 route de la Roche, Ste-Gemmes-sur-Loire", emoji:"🍽️" },
        { id:"dubble", nom:"dubble", cat:"Restaurant végétarien", lat:47.4720, lon:-0.5490,
          desc:"Déjeuners frais, sains et gourmands préparés sur place : très grand choix végétarien ou vegan, superfood et recettes originales dans un cadre épuré.",
          ambiances:["Vegan friendly","Superfood","Rapide"], taille:"Restaurant", access:"Centre-ville d'Angers", emoji:"🥗" },
      ];

      // =====================================================================
      // Carte Leaflet
      // =====================================================================
      const map = L.map("map", { zoomControl: false }).setView([47.470, -0.560], 13);
      L.control.zoom({ position: "topright" }).addTo(map);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      function markerIcon(cat) {
        const st = CAT_STYLE[cat];
        return L.divIcon({
          className: "vgt-marker",
          html:
            '<span style="display:inline-flex;flex-direction:column;align-items:center">' +
            '<span style="background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.6);' +
            'padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;color:#1c1917;' +
            'white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)">' + (st ? st.emoji + " " : "") + cat + "</span>" +
            '<span style="width:14px;height:14px;border-radius:50%;background:' + (st ? st.color : "#34a853") +
            ';border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);margin-top:-3px"></span></span>',
          iconSize: null,
          iconAnchor: [0, 0],
        });
      }

      const markers = {};
      LIEUX.forEach((l) => {
        const m = L.marker([l.lat, l.lon], { icon: markerIcon(l.cat) })
          .addTo(map)
          .bindPopup(
            '<div class="popup-title">' + l.nom + "</div>" +
            '<span class="popup-cat" style="background:' + CAT_STYLE[l.cat].color + '">' + l.cat + " · " + l.taille + "</span>" +
            '<div class="popup-desc">' + l.desc + "</div>",
            { maxWidth: 260 }
          );
        m.on("click", () => selectLieu(l, { zoom: false }));
        markers[l.id] = m;
      });

      // =====================================================================
      // UI : filtres, recherche, liste, fiche
      // =====================================================================
      const state = { query: "", cats: new Set(), selected: null };
      const listEl = document.getElementById("list");
      const chipsEl = document.getElementById("chips");
      const countEl = document.getElementById("count");
      const detailEl = document.getElementById("detail");

      Object.keys(CAT_STYLE).forEach((c) => {
        const b = document.createElement("button");
        b.className = "chip";
        b.textContent = c;
        b.dataset.cat = c;
        b.onclick = () => {
          if (state.cats.has(c)) state.cats.delete(c);
          else state.cats.add(c);
          b.classList.toggle("active", state.cats.has(c));
          render();
        };
        chipsEl.appendChild(b);
      });

      document.getElementById("search").addEventListener("input", (e) => {
        state.query = e.target.value.trim().toLowerCase();
        render();
      });

      function filtered() {
        return LIEUX.filter((l) => {
          const okCat = state.cats.size === 0 || state.cats.has(l.cat);
          const q = state.query;
          const okQ =
            q === "" ||
            l.nom.toLowerCase().includes(q) ||
            l.ambiances.some((a) => a.toLowerCase().includes(q)) ||
            l.desc.toLowerCase().includes(q);
          return okCat && okQ;
        });
      }

      function thumbHTML(l) {
        const st = CAT_STYLE[l.cat];
        return (
          '<div class="thumb" style="--ring:' + st.ring + '">' +
          (l.photo
            ? '<img src="' + photoUrl(l.photo) + '" alt="' + l.nom +
              '" loading="lazy" onerror="this.remove()"/>'
            : l.emoji) +
          "</div>"
        );
      }

      function render() {
        const list = filtered();
        countEl.textContent = list.length + " lieu" + (list.length > 1 ? "x" : "");

        listEl.innerHTML = "";
        list.forEach((l) => {
          const card = document.createElement("button");
          card.className = "card" + (state.selected === l.id ? " selected" : "");
          card.innerHTML =
            thumbHTML(l) +
            '<div style="min-width:0">' +
            "<h3>" + l.nom + "</h3>" +
            '<div class="addr">' + l.access + "</div>" +
            '<div class="tags">' +
            '<span class="tag cat" style="--cat-color:' + CAT_STYLE[l.cat].color + '">' + l.cat + "</span>" +
            l.ambiances.slice(0, 2).map((a) => '<span class="tag">' + a + "</span>").join("") +
            "</div></div>";
          card.onclick = () => selectLieu(l);
          listEl.appendChild(card);
        });
        if (list.length === 0)
          listEl.innerHTML = '<p style="text-align:center;color:#a8a29e;padding:20px;font-size:14px">Aucun lieu ne correspond 😕</p>';

        LIEUX.forEach((l) => {
          if (list.indexOf(l) !== -1) {
            if (!map.hasLayer(markers[l.id])) markers[l.id].addTo(map);
          } else {
            if (map.hasLayer(markers[l.id])) map.removeLayer(markers[l.id]);
          }
        });
      }

      function selectLieu(l, opts) {
        state.selected = l.id;
        detailEl.style.display = "block";
        detailEl.innerHTML =
          '<div class="detail-top">' +
          thumbHTML(l) +
          '<div><h2>' + l.nom + "</h2>" +
          '<span class="popup-cat" style="background:' + CAT_STYLE[l.cat].color + '">' + l.cat + " · " + l.taille + "</span></div>" +
          '<button class="close" title="Fermer">✕</button></div>' +
          '<p class="desc">' + l.desc + "</p>" +
          (l.photo
            ? '<img class="photo" src="' + photoUrl(l.photo) + '" alt="' + l.nom + '" onerror="this.remove()"/>'
            : "") +
          '<div class="tags">' +
          l.ambiances.map((a) => '<span class="tag">' + a + "</span>").join("") +
          "</div>" +
          '<div class="actions">' +
          '<a class="btn-itinerary" href="https://www.openstreetmap.org/?mlat=' + l.lat + "&mlon=" + l.lon +
          '#map=16/' + l.lat + "/" + l.lon + '" target="_blank" rel="noreferrer">🧭 Itinéraire</a>' +
          '<span class="access">' + l.access + "</span></div>";
        detailEl.querySelector(".close").onclick = () => {
          detailEl.style.display = "none";
          state.selected = null;
          render();
        };
        if (!opts || opts.zoom !== false) {
          map.setView([l.lat, l.lon], Math.max(map.getZoom(), 15), { animate: true });
        }
        markers[l.id].openPopup();
        render();
      }

      render();
    </script>
  </body>
</html>
