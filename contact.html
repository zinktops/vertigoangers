<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contactez Vertigo pour vos questions ou réclamations." />
    <title>Contact — Vertigo · Angers</title>
    <script src="matomo.js" defer></script>
    <link rel="icon" type="image/png" sizes="512x512" href="images/favicon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <style>
      :root {
        --green-900: #14532d;
        --green-700: #15803d;
        --green-500: #22c55e;
        --green-100: #dcfce7;
        --green-50: #f0fdf4;
        --bg: #f3faf4;
        --stone: #44403c;
        --stone-light: #78716c;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; display: flex; flex-direction: column;
        background: var(--bg); color: var(--stone);
        font-family: "Inter", system-ui, sans-serif;
      }
      header {
        position: sticky; top: 0; z-index: 1;
        background: rgba(255,255,255,.88); backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--green-100);
      }
      .header-inner {
        max-width: 1080px; margin: 0 auto; padding: 10px 20px;
        display: flex; align-items: center; gap: 14px;
      }
      .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
      .brand img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; }
      .brand h1 { margin: 0; color: var(--green-900); font-size: 20px; font-weight: 800; }
      .brand p { margin: 2px 0 0; color: var(--green-700); font-size: 11px; }
      .page-links { margin-left: auto; display: flex; gap: 8px; }
      .back-link {
        padding: 9px 14px; border: 1px solid var(--green-100);
        border-radius: 999px; background: #fff; color: var(--green-900);
        font-size: 13px; font-weight: 600; text-decoration: none;
      }
      .back-link:hover { border-color: var(--green-500); background: var(--green-50); }
      .back-link.active { border-color: var(--green-500); background: var(--green-50); }
      main {
        width: min(100% - 40px, 880px); margin: 56px auto;
        flex: 1;
      }
      .intro {
        padding: clamp(28px, 7vw, 64px); border: 1px solid var(--green-100);
        border-radius: 28px; background: #fff;
        box-shadow: 0 12px 36px rgba(20,83,45,.07);
      }
      .eyebrow {
        color: var(--green-700); font-size: 12px; font-weight: 700;
        letter-spacing: .1em; text-transform: uppercase;
      }
      h2 {
        max-width: 680px; margin: 14px 0 18px; color: var(--green-900);
        font-size: clamp(32px, 6vw, 52px); line-height: 1.08; letter-spacing: -.04em;
      }
      .lead { max-width: 680px; color: var(--stone-light); font-size: 18px; line-height: 1.7; }
      .mail-link {
        display: inline-block; margin-top: 22px; padding: 13px 18px;
        border-radius: 12px; background: var(--green-500); color: #fff;
        font-size: 14px; font-weight: 700; text-decoration: none;
      }
      .mail-link:hover { background: #16a34a; }
      footer { padding: 18px 20px 24px; color: var(--green-900); font-size: 12px; text-align: center; opacity: .6; }
      @media (max-width: 640px) {
        main { margin: 24px auto; }
        .header-inner { flex-wrap: wrap; }
        .page-links { width: 100%; order: 2; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a class="brand" href="index.html">
          <img src="images/logo_VERTIGO.png" alt="Logo de Vertigo" />
          <span>
            <h1>Vertigo</h1>
            <p>Vert, t'y go · Angers</p>
          </span>
        </a>
        <nav class="page-links" aria-label="Navigation principale">
          <a class="back-link" href="qui-nous-sommes.html">Qui nous sommes&nbsp;?</a>
          <a class="back-link active" href="contact.html" aria-current="page">Contact</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="intro">
        <p class="eyebrow">Contact</p>
        <h2>Une question ou une réclamation&nbsp;?</h2>
        <p class="lead">
          Si vous voulez nous contacter pour des réclamations ou des questions, n'hésitez pas.
        </p>
        <a class="mail-link" href="mailto:lehoursebastien@gmail.com">lehoursebastien@gmail.com</a>
      </section>
    </main>
    <footer>Vertigo — le guide des oasis vertes d'Angers</footer>
  </body>
</html>
